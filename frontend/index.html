<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ant-ech Route Simulation</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">

    <aside class="sidebar">
      <div class="header">
        <div class="logo">🐜</div>
        <div class="title-wrap">
          <div class="title">Ant-ech Route Simulation</div>
          <div class="subtitle">Evacuation Route Simulator</div>
        </div>
      </div>

      <div class="field">
        <label>SELECT BARANGAY</label>
        <select id="barangay">
          <option value="Pinagbuhatan">Pinagbuhatan</option>
        </select>
      </div>

      <div class="field">
        <label>START NODE</label>
        <select id="start">
          <option>Novo Pinagbuhatan</option>
          <option>Kenneth Talipapa</option>
          <option>Pinagbuhatan High School</option>
          <option>Pinagbuhatan Ferry station</option>
          <option>Pinagbuhatan Barangay Hall</option>
          <option>2 Centennial Street, Pinagbuhatan</option>
        </select>
      </div>

      <div class="field">
        <label>END NODE</label>
        <select id="end">
          <option>2 Centennial Street, Pinagbuhatan</option>
          <option>Pinagbuhatan Barangay Hall</option>
          <option>Pinagbuhatan High School</option>
          <option>Kenneth Talipapa</option>
          <option>Novo Pinagbuhatan</option>
          <option>Pinagbuhatan Ferry station</option>
        </select>
      </div>

      <div class="field">
        <label>DISASTER</label>
        <select id="disaster">
          <option value="Flood">Flood</option>
          <option value="Earthquake">Earthquake</option>
          <option value="Fire">Fire</option>
        </select>
      </div>

      <button id="runBtn" class="run-btn">RUN SIMULATION</button>

      <div class="hint">
        UI-only mode: draws a demo route line (backend integration later).
      </div>
    </aside>

    <main class="map-panel">
      <div id="map"></div>
    </main>
  </div>

  <script src="script.js"></script>

  <script
    async
    defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAv5YwrUBMU5OJoETsx5K2n7A8smLHwdt8&callback=initMap">
  </script>
</body>
</html>
